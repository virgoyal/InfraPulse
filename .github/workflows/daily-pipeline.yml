name: Daily pipeline

on:
  schedule:
    - cron: "30 1 * * *"   # 1:30 AM UTC = ~7 AM IST
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

permissions:
  contents: write

# Never let a slow run overlap the next day's run.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  update-tenders:
    runs-on: ubuntu-latest
    # Hard ceiling. Without this a stalled network call sits until GitHub's
    # 6-hour job limit kills it, which is what used to happen every night.
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"   # otherwise diagnostics are lost when a step is killed

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Scrape listings
        timeout-minutes: 10
        working-directory: pipeline
        run: python 01_scrape.py

      - name: Scrape detail pages
        timeout-minutes: 15
        working-directory: pipeline
        run: python 01b_scrape_details.py

      - name: Enrich (Gemini)
        timeout-minutes: 25
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python 02_enrich.py

      - name: Geocode
        timeout-minutes: 15
        working-directory: pipeline
        run: python 03_geocode.py

      - name: Generate insights (Gemini)
        timeout-minutes: 10
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python 04_insights.py

      - name: Finalize
        timeout-minutes: 5
        working-directory: pipeline
        run: python 05_finalize.py

      # Runs even if a step above failed, so partial progress (e.g. tenders
      # enriched before the quota ran out) is never thrown away.
      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            pipeline/data/raw_tenders.json \
            pipeline/data/enriched_tenders.json \
            pipeline/data/geolocated_tenders.json \
            pipeline/data/insights.json \
            pipeline/data/geocode_cache.json \
            frontend/public/data/tenders.json \
            frontend/public/data/insights.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Commit first, THEN rebase on remote — working tree is clean after commit
          git commit -m "chore: daily tender update $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push
